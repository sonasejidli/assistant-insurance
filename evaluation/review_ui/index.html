<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Insurance Legal Review</title>
  <link rel="stylesheet" href="/assets/review.css">
  <script src="/assets/review.js" defer></script>
</head>
<body>
  <header><div><small>INSURANCE LEGAL INTELLIGENCE</small><h1>Expert review</h1></div><button id="sign-out" hidden>Sign out</button></header>
  <main>
    <form id="login" class="panel login">
      <h2>Review access</h2><label>Access token <input id="token" type="password" autocomplete="off" required></label>
      <button class="primary">Open review workspace</button>
    </form>
    <p id="notice" role="status"></p>
    <section id="workspace" hidden>
      <div class="toolbar"><p id="identity"></p><div id="exports"></div></div>
      <div id="metrics" class="metrics"></div>
      <progress id="completion" aria-label="Resolved cases"></progress>
      <p id="coverage" class="muted"></p>
      <div class="columns">
        <aside class="panel" aria-label="Case queue">
          <h2>Case queue</h2>
          <label>Search <input id="search" placeholder="Question or case ID"></label>
          <label>Status <select id="filter"><option value="">All cases</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="disputed">Disputed</option></select></label>
          <nav id="queue" aria-label="Cases"></nav>
        </aside>
        <article id="detail" class="panel" aria-live="polite"><p>Select a case to inspect the question and its sources.</p></article>
      </div>
    </section>
  </main>
</body>
</html>
