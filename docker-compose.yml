name: app

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "8002:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    image: insurance-assistant-english:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EMBED_MODEL: ${EMBED_MODEL:-intfloat/multilingual-e5-large}
        EMBED_MODEL_REVISION: ${EMBED_MODEL_REVISION:-main}
        RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
    env_file:
      - App/.env
    environment:
      INSURANCE_ACCOUNTS_DB: /app/var/accounts/accounts.sqlite3
      QDRANT_URL: http://qdrant:6333
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - account-storage:/app/var/accounts
    ports:
      - "8000:8000"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.0
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-ec", "echo > /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  account-storage:
  qdrant-storage:
